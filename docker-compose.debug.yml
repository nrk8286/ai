services:
  app:
    environment:
      NODE_ENV: development
    ports:
      - "127.0.0.1:9229:9229"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/.next
    command: ["node", "--inspect=0.0.0.0:9229", "node_modules/next/dist/bin/next", "dev", "--hostname", "0.0.0.0"]
