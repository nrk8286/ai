name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_test
      AUTH_SECRET: ci-only-secret-not-used-outside-github-actions
      AUTH_URL: http://localhost:3000
      PLAYWRIGHT: "true"
      PLAYWRIGHT_USE_BUILD: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.15.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and type-check
        run: |
          pnpm lint
          pnpm exec tsc --noEmit

      - name: Create disposable CI database
        run: |
          pnpm db:migrate
          pnpm db:verify
          pnpm test:db

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run tests
        run: pnpm test

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_SECRET: ci-only-container-secret-not-used-outside-github-actions
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Compose files
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.debug.yml config --quiet

      - name: Build container without database credentials
        run: docker compose build app

      - name: Verify container database commands
        run: |
          docker compose up -d --wait db
          docker compose run --rm app npm run db:migrate
          docker compose run --rm app npm run db:verify

      - name: Verify container startup and API routing
        run: |
          docker compose up -d --wait app
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const origin = 'http://127.0.0.1:3000';
          const session = await fetch(`${origin}/api/auth/session`);
          assert.equal(session.status, 200);
          assert.equal(await session.json(), null);
          const history = await fetch(`${origin}/api/history`);
          assert.equal(history.status, 401);
          assert.deepEqual(await history.json(), { error: 'Unauthorized' });
          const login = await fetch(`${origin}/login`);
          assert.equal(login.status, 200);
          assert.match(await login.text(), /user@acme\.com/);
          console.log('Container auth, API routing, and PostgreSQL startup checks passed.');
          NODE

      - name: Container failure logs
        if: failure()
        run: docker compose logs --no-color --tail 100

      - name: Clean up disposable containers
        if: always()
        run: docker compose down --volumes
